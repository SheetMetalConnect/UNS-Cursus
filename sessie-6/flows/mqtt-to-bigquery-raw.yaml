# ==============================================================================
# MQTT -> BigQuery Raw Bridge (UMH Core dataFlow)
# ==============================================================================
# Streamt alle MQTT-berichten van de lokale HiveMQ (cursus stack) naar BigQuery
# als raw JSON. Handig voor 'fire and forget' archivering.
#
# Tabel: uns_cursus.uns_raw_test (vooraf aangemaakt)
# Schema (kolommen): timestamp TIMESTAMP, topic STRING, payload STRING
#
# BigQuery load API limiet: max 1500 load jobs/tabel/dag
# Daarom: grote batches (500 msg of 60s), max_in_flight: 1
#
# Vereist op de UMH host (LET OP - vooraf regelen):
#   1. GCP service account JSON gemount in umh-core container
#   2. Env var GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
#   3. Tabel uns_cursus.uns_raw_test bestaat (zie SQL onderaan dit bestand)
# ==============================================================================

input:
  mqtt:
    urls:
      - tcp://hivemq:1883
    topics:
      - "umh/v1/#"
    client_id: benthos-bigquery-raw-bridge
    dynamic_client_id_suffix: nanoid
    clean_session: true
    qos: 1

pipeline:
  processors:
    - bloblang: |
        root.timestamp = now().ts_format("2006-01-02 15:04:05", "UTC")
        root.topic     = meta("mqtt_topic").or("")
        root.payload   = content().string()

output:
  gcp_bigquery:
    project: ve-systems-486013
    dataset: uns_cursus
    table: uns_raw_test
    format: NEWLINE_DELIMITED_JSON
    max_in_flight: 1
    write_disposition: WRITE_APPEND
    create_disposition: CREATE_NEVER
    batching:
      count: 500
      period: "60s"

# ------------------------------------------------------------------------------
# BigQuery DDL voor de raw landing-tabel:
#
#   CREATE TABLE IF NOT EXISTS uns_cursus.uns_raw_test (
#     timestamp TIMESTAMP,
#     topic     STRING,
#     payload   STRING
#   );
# ------------------------------------------------------------------------------
