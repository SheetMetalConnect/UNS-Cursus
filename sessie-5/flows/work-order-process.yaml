# ==============================================================================
# Work Order Process (Deduplicatie)
# ==============================================================================
# Vergelijkt binnenkomende .process berichten met de database en bepaalt:
#   - .create    → nieuw (nog niet in DB)
#   - .update    → bestaand maar velden gewijzigd
#   - .duplicate → bestaand en niks veranderd (skip)
#
# Topic flow:
#   umh.v1.smc.vienna._work_order.process
#     → (DB lookup + vergelijking)
#     → umh.v1.smc.vienna._work_order.create|update|duplicate
#
# Deploy via: Management Console → Data Flows → Stand-alone → Add
# Naam: work-order-process
# ==============================================================================

input:
  uns:
    umh_topic: "umh\\.v1\\..*\\._work_order\\.process"
    consumer_group: work_order_process

pipeline:
  processors:
    - bloblang: |
        let umh_topic = meta("umh_topic")
        let action = $umh_topic.split(".").index(-1)
        root = if $action == "process" { this } else { deleted() }

    # Normalize incoming types for reliable comparison
    - bloblang: |
        root = this
        root.qty = this.qty.number().catch(0)
        root.priority = if this.priority == null { null } else { this.priority.number().catch(null) }

    # Asset ID opzoeken via ISA-95 locatie (enterprise + site + area + line)
    - branch:
        processors:
          - bloblang: |
              let umh_topic = meta("umh_topic")
              let parts = $umh_topic.split("_work_order").index(0).split(".").slice(2)
              root.enterprise = $parts.index(0).catch("")
              root.site = $parts.index(1).catch("")
              root.area = $parts.index(2).catch("")
              root.line = $parts.index(3).catch("")

          - sql_select:
              driver: postgres
              dsn: ${DB_DSN}
              table: asset
              columns: [id]
              where: enterprise = $1 AND site = $2 AND COALESCE(area,'') = COALESCE($3,'') AND COALESCE(line,'') = COALESCE($4,'')
              args_mapping: "[ this.enterprise, this.site, this.area, this.line ]"

          - bloblang: |
              root.asset_id = if this.type() == "array" && this.length() > 0 {
                this.index(0).id
              } else if this.type() == "object" && this.id != null {
                this.id
              } else {
                null
              }
        result_map: root.asset_id = this.asset_id

    - bloblang: root = if this.asset_id != null { this } else { deleted() }

    # Bestaand record opzoeken
    - branch:
        processors:
          - sql_select:
              driver: postgres
              dsn: ${DB_DSN}
              table: erp_work_order
              columns: ["*"]
              where: order_nr = $1 AND asset_id = $2
              args_mapping: "[ this.order_nr, this.asset_id ]"
        result_map: |
          root.query = if this.length() == 0 {
            "no_match"
          } else {
            this.index(0)
          }

    # Vergelijken: create, update of duplicate?
    - bloblang: |
        let query = this.query
        root = this
        root.query = deleted()
        let due_in = root.due_date.string().catch("null").split("T").index(0).split(" ").index(0)
        let due_db = $query.due_date.string().catch("null").split("T").index(0).split(" ").index(0)
        let change_type = if $query == "no_match" {
          "create"
        } else if root.order_nr == $query.order_nr && root.product == $query.product && root.qty == $query.qty.number().catch(0) && root.customer == $query.customer && root.priority.number().catch(-1) == $query.priority.number().catch(-1) && $due_in == $due_db && root.status == $query.status {
          "duplicate"
        } else {
          "update"
        }
        meta umh_topic = meta("umh_topic").trim_suffix("process") + $change_type
        meta umh_key = $change_type

output:
  uns: {}
