# ==============================================================================
# UNS → MQTT Bridge (Redpanda → HiveMQ)
# ==============================================================================
# Stuurt verwerkte berichten (.create, .update, .duplicate) terug naar MQTT
# zodat je ze in Node-RED kunt monitoren.
#
# Zo zie je precies wat de process-flow beslist heeft:
#   - .create  = nieuwe werkorder (nog niet in database)
#   - .update  = bestaande werkorder met gewijzigde velden
#   - .duplicate = geen verandering (wordt niet opgeslagen)
#
# Deploy via: Management Console → Data Flows → Stand-alone → Add
# Naam: uns-to-mqtt-bridge
# ==============================================================================

input:
  uns:
    umh_topics:
      - "umh\\.v1\\..*\\._work_order\\.(create|update|duplicate)"
    consumer_group: cursus_uns_to_mqtt

pipeline:
  processors:
    - bloblang: |
        let umh_topic = meta("umh_topic")
        let action = $umh_topic.split(".").index(-1)
        meta mqtt_topic = $umh_topic.replace(".", "/")
        root = if $action == "create" || $action == "update" || $action == "duplicate" {
          this
        } else {
          deleted()
        }

output:
  mqtt:
    client_id: cursus_uns_to_mqtt
    dynamic_client_id_suffix: nanoid
    topic: ${! meta("mqtt_topic") }
    urls:
      - tcp://hivemq:1883
